<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劉家妤 | 個人作品集 Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Heiti TC', 'Helvetica Neue', Arial, sans-serif;
        }
        /* 讓跳轉網頁時有平滑滾動的效果 */
        html {
            scroll-behavior: smooth;
        }
        body {
            color: #333;
            background-color: #ffffff;
            line-height: 1.7;
        }
        a { text-decoration: none; color: inherit; }

        /* 頂端導覽列 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            z-index: 1000;
            border-bottom: 1px solid #f0f0f0;
        }
        .logo {
            font-weight: bold;
            font-size: 1.2rem;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
        }
        .logo img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        /* 電腦版選單 */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        .nav-links a {
            font-size: 0.9rem;
            color: #4a5568;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #b7791f; }

        /* 手機版漢堡按鈕 (紅圈處) */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
            padding: 5px;
        }
        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: #1a202c;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* 1. 首頁大雙欄布局 */
        .hero-section {
            min-height: 100vh;
            display: flex;
            padding-top: 65px;
        }
        .hero-left {
            width: 45%;
            background-color: #2d3748;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 5%;
            position: relative;
        }
        .profile-container {
            max-width: 400px;
            margin: 0 auto;
        }
        .profile-pic {
            width: 200px;
            height: 250px;
            background-color: #4a5568;
            border-radius: 8px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 2px solid #b7791f;
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hero-left h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .hero-left p {
            color: #cbd5e0;
            font-size: 1.05rem;
            margin-bottom: 20px;
        }

        .hero-right {
            width: 55%;
            background-color: #f7fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 6%;
        }
        .section-title {
            font-size: 1.6rem;
            color: #1a202c;
            margin-bottom: 30px;
            font-weight: bold;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 30px;
            height: 3px;
            background-color: #b7791f;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .project-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
        }
        .project-icon {
            width: 40px;
            height: 40px;
            background: #fef3c7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #b7791f;
        }
        .project-card h3 { font-size: 1.15rem; margin-bottom: 8px; }
        .project-card p { color: #718096; font-size: 0.9rem; }

        /* 2. 全新作品集分類展示區塊 */
        .portfolio-section {
            padding: 100px 5%;
            background-color: #ffffff;
        }
        .portfolio-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 分類按鈕列 */
        .filter-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #b7791f;
            color: white;
            border-color: #b7791f;
        }
        /* 作品網格 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        .gallery-item {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #edf2f7;
            transition: 0.3s;
        }
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .gallery-img {
            width: 100%;
            height: 200px;
            background-color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-size: 0.9rem;
            position: relative;
        }
        .gallery-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .gallery-info {
            padding: 20px;
        }
        .gallery-info h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #2d3748;
        }
        .gallery-info p {
            color: #718096;
            font-size: 0.85rem;
        }

        /* 3. 關於與服務內容 */
        .content-section {
            padding: 100px 5%;
            background-color: #f7fafc;
        }
        .content-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }
        .info-block h3 { font-size: 1.3rem; margin-bottom: 15px; color: #2d3748; }
        .info-block p { color: #4a5568; margin-bottom: 25px; }

        /* 合作聯絡區塊 */
        .cooperate-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fdfbf7;
            border-radius: 16px;
            padding: 50px 6%;
            border: 1px solid #f3ebd9;
            margin-top: 60px;
            width: 100%;
        }
        .cooperate-text h2 { font-size: 2rem; color: #1a202c; margin-bottom: 20px; }
        .cta-button {
            display: inline-block;
            background: #d69e2e;
            color: white;
            padding: 12px 40px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .cta-button:hover { background: #b7791f; }
        .contact-details { color: #4a5568; font-size: 0.95rem; }
        .contact-details p { margin-bottom: 5px; }
        .cooperate-logo { width: 160px; height: 160px; }
        .cooperate-logo img { width: 100%; height: 100%; object-fit: contain; }

        footer {
            text-align: center;
            padding: 30px;
            background: #1a202c;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        /* 響應式調整：包含手機滿版與彈出選單設定 */
        @media (max-width: 900px) {
            .hero-section { flex-direction: column; }
            .hero-left, .hero-right { width: 100%; padding: 60px 8%; }
            .project-grid { grid-template-columns: 1fr; }
            .content-inner { grid-template-columns: 1fr; gap: 40px; }
            .cooperate-box { flex-direction: column; text-align: center; gap: 40px; }
            
            /* 手機版開啟漢堡選單圖標 */
            .menu-toggle { display: flex; }
            
            /* 手機版覆蓋式導覽選單 */
            .nav-links {
                position: fixed;
                top: 63px;
                left: 0;
                width: 100%;
                background: #ffffff;
                flex-direction: column;
                gap: 0;
                box-shadow: 0 10px 15px rgba(0,0,0,0.05);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease-out;
            }
            .nav-links.active {
                max-height: 300px;
            }
            .nav-links li {
                width: 100%;
                text-align: center;
                border-bottom: 1px solid #f7fafc;
            }
            .nav-links a {
                display: block;
                padding: 15px 0;
