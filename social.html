<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電商平面美學作品集 | 劉家妤</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang TC', Arial, sans-serif; }
        body { color: #333; background: url('IMG_5453.jpeg') repeat; background-size: 350px; line-height: 1.7; padding: 40px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-nav { margin-bottom: 30px; font-size: 0.9rem; color: #b7791f; font-weight: bold; }
        .back-nav a { text-decoration: none; color: #4a5568; margin-right: 8px; }
        .back-nav a::after { content: ' /'; margin-left: 8px; color: #a0aec0; }
        h1 { font-size: 2.2rem; color: #1a202c; margin-bottom: 10px; position: relative; padding-bottom: 15px; }
        h1::after { content: ''; position: absolute; left: 0; bottom: 0; width: 50px; height: 3px; background-color: #b7791f; }
        .subtitle { color: #718096; margin-bottom: 50px; font-size: 1.05rem; }
        .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 35px; }
        .work-item { background: rgba(255,255,255,0.85); backdrop-filter: blur(5px); border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.02); }
        .work-img { width: 100%; height: 260px; background-color: rgba(226, 232, 240, 0.4); display: flex; align-items: center; justify-content: center; color: #cbd5e0; }
        .work-info { padding: 25px; }
        .work-info h3 { font-size: 1.25rem; color: #1a202c; margin-bottom: 10px; }
        .work-info p { color: #4a5568; font-size: 0.95rem; }
        footer { text-align: center; padding: 60px 0 20px 0; color: #a0aec0; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="index.html">首頁</a><span>電商平面美學</span></div>
        <h1>電商平面美學專區</h1>
        <p class="subtitle">結合商業行銷與精緻美感，為品牌量身打造高轉換率的 Banner 廣告、IG 風格排版貼文及包月社群圖案設計。</p>
        <div class="work-grid">
            <div class="work-item">
                <div class="work-img"><span>【上傳照片後，將代碼替換即可顯示】</span></div>
                <div class="work-info">
                    <h3>電商商業 Banner 設計實錄</h3>
                    <p>針對美妝/服飾品牌設計的促銷橫幅廣告，精準拿捏排版比例，提升點擊率。</p>
                </div>
            </div>
        </div>
        <footer>&copy; 2026 BLUE BUNNY Portfolio. All rights reserved.</footer>
    </div>
</body>
</html>
